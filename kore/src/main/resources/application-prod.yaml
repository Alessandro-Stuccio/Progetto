## Profilo di produzione (Render). Si attiva con SPRING_PROFILES_ACTIVE=prod.
## Tutta la configurazione arriva da variabili d'ambiente: datasource sul
## PostgreSQL gestito di Render, RabbitMQ su CloudAMQP, CORS sul dominio Vercel.

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # Il free tier ha 0.1 CPU e 512 MB: pochi thread bastano e risparmiano memoria.
      max: 20

spring:
  datasource:
    # sslmode=prefer: usa TLS se il server lo offre, altrimenti connessione in
    # chiaro sulla rete privata di Render — evita fallimenti al primo avvio.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Come in dev: schema ricreato a ogni avvio e ripopolato da data.sql.
      # Il sito pubblicato è una demo: ogni riavvio (incluso il risveglio dal
      # free tier di Render) riparte dai dati seed puliti.
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Su Render non c'è Docker: DB e broker sono servizi gestiti esterni.
  docker:
    compose:
      enabled: false

  # CloudAMQP: URI unico amqps://user:password@host/vhost.
  # "addresses" prevale su host/port/username/password del profilo base.
  rabbitmq:
    addresses: ${CLOUDAMQP_URL}

# Chiave di firma JWT fissa (base64/alfanumerica, min 44 caratteri) così i token
# sopravvivono ai riavvii. Se vuota, viene generata casualmente come in dev.
jwt:
  secret: ${JWT_SECRET:}

cors:
  # Uno o più origin separati da virgola, es. https://kore-frontend.vercel.app
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://kore-frontend.vercel.app}

# L'health check di Render deve riflettere solo l'applicazione e il suo DB:
# senza queste esclusioni Spring aggrega anche RabbitMQ e SMTP, e un problema
# temporaneo su un servizio esterno farebbe marcare "failed" l'intero deploy.
management:
  health:
    rabbit:
      enabled: false
    mail:
      enabled: false

# Anti spin-down del free tier: Render valorizza da solo RENDER_EXTERNAL_URL
# (l'URL pubblico del servizio); il KeepAliveScheduler lo pinga ogni 10 minuti
# così il traffico in ingresso non si azzera mai e il servizio resta sveglio.
keepalive:
  url: ${RENDER_EXTERNAL_URL:}

# Solo console: il filesystem di Render è effimero e l'appender JDBC
# richiederebbe il catalog kore_logs, che sul Postgres gestito non esiste.
logging:
  config: classpath:log4j2-prod.xml
