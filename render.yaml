# Blueprint Render: backend Spring Boot (Docker) + PostgreSQL gestito.
# Dalla dashboard di Render: New → Blueprint → seleziona questo repository.
# Le variabili con "sync: false" vengono chieste al momento della creazione.

services:
  - type: web
    name: kore-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./kore/Dockerfile
    dockerContext: ./kore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      # Contiene heap e stack: il piano free ha 512 MB di RAM totali.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -Xss512k"
      - key: DB_HOST
        fromDatabase:
          name: kore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kore-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kore-db
          property: password
      # URI CloudAMQP (amqps://user:password@host/vhost) — da incollare alla creazione.
      - key: CLOUDAMQP_URL
        sync: false
      # Chiave di firma JWT (128 caratteri alfanumerici) — da incollare alla creazione.
      - key: JWT_SECRET
        sync: false
      # Origin del frontend su Vercel; aggiornabile dalla dashboard senza toccare il codice.
      - key: CORS_ALLOWED_ORIGINS
        value: https://progetto-fe.vercel.app

databases:
  - name: kore-db
    databaseName: kore
    user: kore
    plan: free
    region: frankfurt
