spring:
  application:
    name: tesi
  profiles:
    active: dev
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true

file:
  upload-dir: uploads

mail:
  from: ${MAIL_FROM:koreadministration@gmail.com}

admin:
  email: koreadministration@gmail.com

jwt:
  length: 128
  expiration: 86400000

cors:
  allowed-origins: http://localhost:4200


schedule:
  time:
    subscription: 0 0 0 * * ? # Ogni giorno a mezzanotte
    bookings: 0 */5 * * * ? # Ogni 5 minuti